<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Deep Boda, Senior DevOps and Full-Stack Engineer">
<style>
  .packet { animation: run 4.8s cubic-bezier(.45,0,.25,1) infinite; }
  .halo { animation: run 4.8s cubic-bezier(.45,0,.25,1) infinite, pulse 1.2s ease-in-out infinite alternate; transform-box: fill-box; }
  @keyframes run { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(510px); opacity: 0; } }
  @keyframes pulse { from { r: 10; } to { r: 16; } }
  @media (prefers-reduced-motion: reduce) { .packet, .halo { animation: none; } }
</style>
<defs>
  <radialGradient id="glow" cx="78%" cy="20%" r="60%"><stop offset="0" stop-color="#c8365a22"/><stop offset="1" stop-color="#fcfcfa" stop-opacity="0"/></radialGradient>
  <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fcfcfa" stop-opacity="0"/><stop offset="1" stop-color="#fcfcfa"/></linearGradient>
</defs>
